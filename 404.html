<!DOCTYPE html>
<html lang="hi-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 – पृष्ठ नहीं मिला | Bhakti Amrit Sanatan</title>
  <meta name="description" content="यह पृष्ठ उपलब्ध नहीं है। भक्ति अमृत सनातन के होम पेज पर वापस जाएं।" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Noto+Serif+Devanagari:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --clr-bg:     #0d001f;
      --clr-purple: #1a0533;
      --clr-gold:   #f59e0b;
      --clr-gold-l: #fcd34d;
      --clr-orange: #ea580c;
      --clr-cream:  #fef3c7;
      --clr-muted:  rgba(255,255,255,0.65);
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-deva:  'Noto Serif Devanagari', serif;
      --font-sans:  'Inter', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--clr-bg);
      color: #fff;
      font-family: var(--font-sans);
    }

    /* Animated background */
    body {
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(107,33,168,0.45) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 90% 80%, rgba(234,88,12,0.2) 0%, transparent 60%),
        linear-gradient(135deg, #0d001f 0%, #1a0533 50%, #2d0b50 100%);
      min-height: 100vh;
    }

    /* Particles */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: float-up linear infinite;
    }
    @keyframes float-up {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.3; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Main layout */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    /* Om symbol */
    .om {
      font-size: clamp(60px, 12vw, 120px);
      font-family: var(--font-deva);
      background: linear-gradient(135deg, #f59e0b, #ea580c, #fcd34d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pulse-glow 3s ease-in-out infinite;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 30px rgba(245,158,11,0.4));
    }
    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(245,158,11,0.3)); }
      50%       { filter: drop-shadow(0 0 50px rgba(245,158,11,0.7)); }
    }

    /* 404 number */
    .error-code {
      font-family: var(--font-serif);
      font-size: clamp(80px, 18vw, 180px);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #fcd34d 0%, #f59e0b 50%, #ea580c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -4px;
      margin-bottom: 16px;
    }

    .divider {
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #f59e0b, transparent);
      margin: 0 auto 24px;
      border-radius: 2px;
    }

    .title-hi {
      font-family: var(--font-deva);
      font-size: clamp(20px, 4vw, 32px);
      font-weight: 600;
      color: var(--clr-cream);
      margin-bottom: 8px;
    }

    .title-en {
      font-family: var(--font-serif);
      font-size: clamp(14px, 2.5vw, 20px);
      font-weight: 400;
      color: var(--clr-muted);
      margin-bottom: 32px;
    }

    /* Quote */
    .quote {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: 16px;
      padding: 20px 28px;
      max-width: 520px;
      margin: 0 auto 40px;
      backdrop-filter: blur(12px);
    }
    .quote p {
      font-family: var(--font-deva);
      font-size: clamp(14px, 2vw, 18px);
      color: var(--clr-gold-l);
      line-height: 1.8;
      font-style: italic;
    }
    .quote cite {
      display: block;
      margin-top: 10px;
      font-family: var(--font-sans);
      font-size: 12px;
      color: var(--clr-muted);
      letter-spacing: 0.05em;
    }

    /* Buttons */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 50px;
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #fff;
      box-shadow: 0 4px 20px rgba(245,158,11,0.35);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(245,158,11,0.5);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.07);
      color: var(--clr-cream);
      border: 1px solid rgba(245,158,11,0.3);
    }
    .btn-secondary:hover {
      background: rgba(245,158,11,0.15);
      border-color: var(--clr-gold);
      transform: translateY(-2px);
    }

    /* Quick nav */
    .quick-nav {
      margin-top: 48px;
      max-width: 600px;
    }
    .quick-nav h3 {
      font-family: var(--font-sans);
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--clr-muted);
      margin-bottom: 16px;
    }
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .nav-links a {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(245,158,11,0.15);
      color: var(--clr-cream);
      font-size: 14px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .nav-links a:hover {
      background: rgba(245,158,11,0.15);
      border-color: rgba(245,158,11,0.4);
      transform: translateY(-1px);
    }
  </style>

    <link rel="canonical" href="https://www.bhaktiamritsanatan.com/404" />
</head>
<body>

<!-- Particles -->
<div class="particles" id="particles" aria-hidden="true"></div>

<main class="page">
  <div class="om" role="img" aria-label="Om">ॐ</div>

  <div class="error-code">404</div>
  <div class="divider"></div>

  <h1 class="title-hi">यह पृष्ठ नहीं मिला</h1>
  <p class="title-en">This page could not be found</p>

  <div class="quote">
    <p>नैनं छिन्दन्ति शस्त्राणि नैनं दहति पावकः।<br>
       न चैनं क्लेदयन्त्यापो न शोषयति मारुतः॥</p>
    <cite>— Bhagavad Gita 2.23</cite>
  </div>

  <div class="actions">
    <a href="/" class="btn btn-primary">🏠 Home / होम पेज</a>
    <a href="/mantras" class="btn btn-secondary">🔱 Mantras</a>
  </div>

  <nav class="quick-nav" aria-label="Site sections">
    <h3>Explore / अन्वेषण करें</h3>
    <div class="nav-links">
      <a href="/mantras">🔱 Mantras</a>
      <a href="/puja-vidhi">🪔 Puja Vidhi</a>
      <a href="/geeta-gyan">📖 Geeta Gyan</a>
      <a href="/vrat-festivals">📅 Vrat &amp; Festivals</a>
      <a href="/dev-katha">🕉️ Dev Katha</a>
      
      <a href="/donate">🙏 Donate</a>
    </div>
  </nav>
</main>

<script>
(function() {
  // Generate floating particles
  var container = document.getElementById('particles');
  var colors = ['#f59e0b','#fcd34d','#ea580c','#fb923c','#fbbf24'];
  for (var i = 0; i < 30; i++) {
    var p = document.createElement('div');
    p.className = 'particle';
    var size = Math.random() * 6 + 2;
    p.style.cssText = [
      'width:' + size + 'px',
      'height:' + size + 'px',
      'left:' + Math.random() * 100 + '%',
      'background:' + colors[Math.floor(Math.random() * colors.length)],
      'animation-duration:' + (Math.random() * 10 + 8) + 's',
      'animation-delay:' + Math.random() * 8 + 's'
    ].join(';');
    container.appendChild(p);
  }
})();
</script>
</body>
</html>
